<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bakery Staff Login</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center">
<div style="max-width:380px;width:100%;padding:20px">
  <div style="text-align:center;margin-bottom:22px">
    <h1 id="loginTitle" style="margin-bottom:2px">Staff Login</h1>
    <p>Sign in to manage orders and the menu.</p>
  </div>
  <form id="loginForm" class="card">
    <div id="notice"></div>
    <div class="field"><label for="username">Username</label><input class="input" id="username" required autocomplete="username"></div>
    <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary btn-block" type="submit">Log In</button>
  </form>
  <p style="text-align:center;margin-top:14px"><a href="/">← Back to website</a></p>
</div>
<script src="/js/common.js"></script>
<script>
(async () => { try { const cfg = await getConfig(); document.getElementById('loginTitle').textContent = cfg.name + ' — Staff Login'; } catch {} })();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    await api('/api/admin/login', { method: 'POST', body: JSON.stringify({
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
    })});
    location.href = '/admin';
  } catch (err) {
    document.getElementById('notice').innerHTML = `<div class="notice error">${escapeHTML(err.message || 'Login failed')}</div>`;
    btn.disabled = false; btn.textContent = 'Log In';
  }
});
</script>
</body>
</html>
